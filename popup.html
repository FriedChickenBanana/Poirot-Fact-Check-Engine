<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>Misinfo Detector</h1>
  </div>
  
  <div class="content" id="history-container">
    <div id="no-history">No recent checks found.</div>
    <div id="history-list"></div>

    <div class="settings">
      <div class="settings-title">Backend URL</div>
      <input id="backend-url" type="text" placeholder="http://localhost:3000" autocomplete="off" />
      <div class="settings-actions">
        <button id="save-backend-url" type="button">Save</button>
        <span id="backend-save-status" class="settings-status"></span>
      </div>
      <div class="settings-help">Paste your ngrok HTTPS forwarding URL here.</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
